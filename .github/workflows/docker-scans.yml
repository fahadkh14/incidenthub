# Goal - Ensure the docker files and Docker images are security Tested

name: Docker Scan

on:
    workflow_call:

jobs:
    docker-file-lint-and-scan:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                floders: ['backend','frontend']
        steps:
          - name: Code Checkout
            uses: actions/checkout@v7

          - name:  ${{ matrix.floders }} Dockerfile lint
            uses:  hadolint/hadolint-action@v3.1.0
            with:
              dockerfile: ${{ matrix.floders }}/Dockerfile

          - name: Docker Login 
            uses: docker/login-action@v4
            with: 
              username: ${{ vars.DOCKERHUB_USERNAME }} 
              password: ${{ secrets.DOCKERHUB_TOKEN }} 
          
          - name: Docker Build ${{ matrix.floders }}
            run: docker build -t  ${{ vars.DOCKERHUB_USERNAME }}/incidenthub${{ matrix.floders }}:latest  .
            working-directory: ${{ matrix.floders }}

          - name: Run Trivy vulnerability scanner
            uses: aquasecurity/trivy-action@v0.36.0
            with:
              image-ref: ${{ vars.DOCKERHUB_USERNAME }}/incidenthub${{ matrix.floders }}:latest  .
              format: 'table'
              exit-code: '1'
              ignore-unfixed: true
              vuln-type: 'os,library'
              severity: 'CRITICAL,HIGH'  
              



   
        