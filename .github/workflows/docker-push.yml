name: IncidentHub CI

on:
    workflow_call:

jobs:
  frontend:
    runs-on: ubuntu-latest
    strategy:
        fail-fast: false
        matrix:
          floders: ['backend','frontend']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.floders }
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/incidenthubi-${{ matrix.floders }latest

  

      
      