services:

  mysql:
    image: mysql:8.4
    container_name: incidenthub-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - incidenthub_network

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend

    container_name: incidenthub-backend
    restart: unless-stopped

    ports:
      - "5673:5673"

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      BACKEND_PORT: 5673

    networks:
      - incidenthub_network

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:5673/api/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 10


  frontend:
    build:
      context: ./frontend

    container_name: incidenthub-frontend
    restart: unless-stopped

    ports:
      - "8070:80"

    networks:
      - incidenthub_network

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O-",
          "http://127.0.0.1/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 10


  nginx:
    image: nginx:alpine
    container_name: incidenthub-nginx
    restart: unless-stopped

    ports:
      - "8082:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    networks:
      - incidenthub_network

    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy


volumes:
  mysql_data:


networks:
  incidenthub_network:
    driver: bridge